# =============================================================================
# SAL Example Adapter — reference configuration
# =============================================================================

sal:
  adapter:
    name: example-adapter
    type: ExampleAdapter
  service:
    environment-key: ""
    sal-version: 1
  client:
    request-timeout: 120
    service-request-timeout: 10
  command:
    threads: 10
    result-threads: 10

spring:
  application:
    name: ${sal.adapter.name}
  rabbitmq:
    host: localhost
    port: 5672
    virtual-host: dev
    username: guest
    password: guest
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
